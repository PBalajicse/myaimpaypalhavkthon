spring.application.name=myaimproject
server.port=8081
# H2 Database configuration - No Password Needed!
# Pure Java In-Memory Database - No Password or Configuration Needed!
spring.datasource.url=jdbc:h2:file:~/paypal_ai_data/paypal_ai_db;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

# JPA settings for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Web Console (To check saved data in browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.main.allow-circular-references=true

paypal.client-id=YOUR_PAYPAL_SANDBOX_CLIENT_ID
paypal.client-secret=YOUR_PAYPAL_SANDBOX_CLIENT_SECRET
paypal.oauth-token-url=https://api-m.sandbox.paypal.com/v1/oauth2/token
paypal.orders-url=https://api-m.sandbox.paypal.com/v2/checkout/orders
paypal.mode=sandbox



jwt.secret=CHANGE-THIS-TO-A-LONG-RANDOM-SECRET-KEY-AT-LEAST-64-CHARACTERS
jwt.expiration-ms=86400000