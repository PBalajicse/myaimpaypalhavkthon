<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayPal AI Login</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b1120;
            color: #e2e8f0;
            font-family: "Segoe UI", Arial, sans-serif;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: #111827;
            border: 1px solid #1f2937;
            border-radius: 16px;
            padding: 30px;
        }

        h1 {
            color: #38bdf8;
            text-align: center;
            margin-bottom: 8px;
        }

        p {
            color: #94a3b8;
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #334155;
            border-radius: 10px;
            background: #0b1120;
            color: #e2e8f0;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .login {
            background: #2563eb;
            color: white;
        }

        .register {
            background: #16a34a;
            color: white;
        }

        .output {
            margin-top: 15px;
            padding: 14px;
            border-radius: 10px;
            background: #0b1120;
            border: 1px solid #334155;
            min-height: 60px;
            white-space: pre-wrap;
            word-break: break-word;
            font-size: 14px;
        }

        .success {
            color: #22c55e;
        }

        .error {
            color: #ef4444;
        }

        .chat-link {
            display: block;
            margin-top: 15px;
            text-align: center;
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
<div class="card">
    <h1>PayPal AI Login</h1>
    <p>Secure JWT authentication</p>

    <label>Email</label>
    <input type="email" id="email" placeholder="Enter email">

    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password">

    <button class="login" onclick="login()">Login</button>
    <button class="register" onclick="register()">Create Account</button>

    <div id="output" class="output">
        Enter your email and password.
    </div>

    <a class="chat-link" href="/ai-chat.html">
        Go to AI Chat
    </a>
</div>

<script>
    const API = "";

    function showMessage(message, isError) {
        const output = document.getElementById("output");
        output.className = "output " + (isError ? "error" : "success");
        output.innerText = message;
    }

    async function register() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!email || !password) {
            showMessage("Email and password are required.", true);
            return;
        }

        try {
            const response = await fetch(API + "/api/auth/register", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email, password })
            });

            const data = await response.text();
            showMessage(data, !response.ok);

        } catch (error) {
            showMessage("Server connection failed.", true);
        }
    }

    async function login() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!email || !password) {
            showMessage("Email and password are required.", true);
            return;
        }

        try {
            const response = await fetch(API + "/api/auth/login", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok && data.token) {
                localStorage.setItem("jwtToken", data.token);
                showMessage("Login successful. Opening AI Chat...", false);

                setTimeout(function () {
                    window.location.href = "/ai-chat.html";
                }, 1000);

            } else {
                showMessage(JSON.stringify(data), true);
            }

        } catch (error) {
            showMessage("Server connection failed.", true);
        }
    }
</script>

</body>
</html>
